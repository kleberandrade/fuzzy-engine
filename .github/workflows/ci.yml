name: Dart and Flutter
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  pub-score:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - uses: dart-lang/setup-dart@v1
      - run: dart pub global activate pana 0.23.19
      # pana may modify the analyzed package; keep the checkout untouched.
      - run: cp -R "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pub-score"
      - run: dart pub global run pana --json --exit-code-threshold 0 --flutter-sdk "$FLUTTER_ROOT" "$RUNNER_TEMP/pub-score" > "$RUNNER_TEMP/pana-report.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pub-score-report
          path: ${{ runner.temp }}/pana-report.jsonl
          retention-days: 14
  interoperability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: dart pub get --no-example
      - run: python -m pip install -r tool/external-requirements.txt
      - run: dart run tool/export_external_cases.dart > /tmp/fis-cases.json
      - run: python tool/compare_external.py /tmp/fis-cases.json
  dart:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sdk: ['3.3.4', stable]
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      # The core is pure Dart; the example has its own Flutter job.
      - run: dart pub get --no-example
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed lib test example benchmark tool
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart test tool/test
      - if: matrix.sdk == 'stable'
        run: dart doc
  flutter:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze --no-pub
        working-directory: example
      - run: flutter test --no-pub
        working-directory: example
      - run: flutter build web --no-pub
        working-directory: example
      # Publishing validates the bundled Flutter example too.
      - run: flutter pub get
      - run: flutter pub publish --dry-run
