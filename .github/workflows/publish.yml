name: Publish to pub.dev
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dart-lang/setup-dart@v1
      - run: dart run tool/check_release_tag.dart "${{ github.ref_name }}"
  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # setup-dart configures temporary Pub OIDC credentials for this tagged run.
      - uses: dart-lang/setup-dart@v1
      - run: flutter pub get
      - run: flutter pub publish --dry-run
      - run: flutter pub publish --force
